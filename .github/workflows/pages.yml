name: Deploy preview to GitHub Pages

# Builds the static export (scripts/export-pages.mjs) and publishes it as the project site.
# Skipped while the repository is private: GitHub Pages on a free account needs a public repository.
# One-time setup after making the repository public: Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The photographs in public/media are committed, so the image pipeline does not run here.
      - name: Static export
        run: node scripts/export-pages.mjs --in-place --base "/${{ github.event.repository.name }}" --origin "https://${{ github.repository_owner }}.github.io"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
