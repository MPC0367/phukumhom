name: Deploy www.phukumhom.com to GitHub Pages

# Builds the static export (scripts/export-pages.mjs) and publishes it. Since 28 Nov 2026 this is the
# resort's own website at https://www.phukumhom.com (custom domain set in Settings → Pages; DNS at the
# resort's host: phukumhom.com A → GitHub Pages, www CNAME → mpc0367.github.io), so it is built at the
# domain root as the production site. A push to main goes live.
# Skipped while the repository is private: GitHub Pages on a free account needs a public repository.
# One-time setup after making the repository public: Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The photographs in public/media are committed, so the image pipeline does not run here.
      - name: Static export
        run: node scripts/export-pages.mjs --in-place --base "" --origin "https://www.phukumhom.com" --production

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
